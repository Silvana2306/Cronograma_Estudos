<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viagem Flórida & NY - Login</title>
    <style>
        :root { --primary: #ff6b6b; --secondary: #4ecdc4; --dark: #2d3436; --light: #f7f1e3; --white: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--light); color: var(--dark); margin: 0; padding: 20px; }
        h1, h2, h3 { text-align: center; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: var(--white); border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* Estilos do Login */
        #login-screen { max-width: 400px; margin: 100px auto; text-align: center; }
        .login-input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;}
        #login-error { color: red; margin-bottom: 10px; font-weight: bold; }
        
        /* Elementos da Interface Ocultos Inicialmente */
        .hidden { display: none !important; }
        
        /* Finanças e Layout Base */
        .finance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: center; }
        .progress-bar-bg { background-color: #eee; border-radius: 10px; height: 25px; width: 100%; overflow: hidden; margin-top: 10px; }
        .progress-bar-fill { background-color: var(--secondary); height: 100%; width: 0%; transition: width 0.4s ease; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 12px; }
        .input-group { display: flex; gap: 10px; margin-top: 10px; }
        input[type="number"], input[type="text"] { padding: 10px; border: 1px solid #ccc; border-radius: 5px; flex: 1; }
        button { padding: 10px 15px; background-color: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #ff5252; }
        
        /* Botão de Sair */
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-sair { background-color: #777; }
        .btn-sair:hover { background-color: #555; }

        /* Listas */
        .lists-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .list-section ul { list-style-type: none; padding: 0; }
        .list-section li { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
        .list-section div { display: flex; align-items: center; }
        .list-section input[type="checkbox"] { margin-right: 10px; transform: scale(1.2); }
        .list-section li.checked span { text-decoration: line-through; color: #888; }
        .delete-btn { background: none; color: red; margin-left: auto; padding: 0; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="login-screen" class="card">
    <h2>🔐 Acesso Restrito</h2>
    <p>Painel de Viagem: Silvana & Julia</p>
    <div id="login-error"></div>
    <input type="email" id="email" class="login-input" placeholder="Seu E-mail">
    <input type="password" id="senha" class="login-input" placeholder="Sua Senha">
    <button onclick="fazerLogin()" style="width: 100%; margin-top: 10px;">Entrar</button>
</div>

<!-- PAINEL DA VIAGEM (Oculto até fazer login) -->
<div id="app-screen" class="container hidden">
    
    <div class="header-top">
        <h1>✈️ Mega Viagem: Flórida & NY</h1>
        <button class="btn-sair" onclick="fazerLogout()">Sair (Logout)</button>
    </div>
    
    <!-- META FINANCEIRA -->
    <div class="card">
        <h2>💰 Meta Financeira da Dupla</h2>
        <div class="finance-grid">
            <div>
                <p><strong>Meta Total:</strong> R$ 42.000,00</p>
                <p><strong>Total Poupado:</strong> R$ <span id="valor-atual">0</span></p>
                <div class="input-group">
                    <input type="number" id="input-dinheiro" placeholder="Adicionar R$">
                    <button onclick="adicionarDinheiro()">Somar</button>
                    <button onclick="zerarDinheiro()" style="background-color: #777;">Zerar</button>
                </div>
            </div>
            <div>
                <p>Progresso:</p>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-bar">0%</div>
                </div>
            </div>
        </div>
    </div>

    <!-- CHECKLISTS -->
    <div class="card">
        <h2>✅ Checklists de Viagem</h2>
        <div class="lists-grid">
            <div class="list-section">
                <h3 style="color: var(--secondary)">Compartilhado</h3>
                <div class="input-group">
                    <input type="text" id="input-comum" placeholder="Novo item...">
                    <button onclick="adicionarTarefa('comum', 'input-comum')">+</button>
                </div>
                <ul id="lista-comum"></ul>
            </div>
            <div class="list-section">
                <h3 style="color: var(--primary)">Silvana</h3>
                <div class="input-group">
                    <input type="text" id="input-silvana" placeholder="Novo item...">
                    <button onclick="adicionarTarefa('silvana', 'input-silvana')">+</button>
                </div>
                <ul id="lista-silvana"></ul>
            </div>
            <div class="list-section">
                <h3 style="color: var(--primary)">Julia</h3>
                <div class="input-group">
                    <input type="text" id="input-julia" placeholder="Novo item...">
                    <button onclick="adicionarTarefa('julia', 'input-julia')">+</button>
                </div>
                <ul id="lista-julia"></ul>
            </div>
        </div>
    </div>
</div>

<!-- IMPORTAR FIREBASE V9 -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, doc, onSnapshot, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  // AS SUAS CREDENCIAIS REAIS DO FIREBASE
  const firebaseConfig = {
    apiKey: "AIzaSyA_sw7bGSy5WZGU7snzT0pHy33h81D7DXk",
    authDomain: "cronograma-dff4f.firebaseapp.com",
    projectId: "cronograma-dff4f",
    storageBucket: "cronograma-dff4f.firebasestorage.app",
    messagingSenderId: "880920689330",
    appId: "1:880920689330:web:679bdb8d95ae36f7b1e7ab"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  
  const docRef = doc(db, "planejamento", "viagem2027");
  const META_TOTAL = 42000;
  let unsubscribeSnapshot = null; // Variável para controlar a sincronização

  // --- CONTROLE DE AUTENTICAÇÃO E TELAS ---
  onAuthStateChanged(auth, (user) => {
    if (user) {
        // Usuário logado: Esconde login, mostra painel e inicia sincronização
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
        iniciarApp();
    } else {
        // Deslogado: Esconde painel, mostra login e para a sincronização
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('app-screen').classList.add('hidden');
        if(unsubscribeSnapshot) unsubscribeSnapshot(); 
    }
  });

  window.fazerLogin = function() {
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      const erroDiv = document.getElementById('login-error');
      erroDiv.innerText = "Conectando...";
      
      signInWithEmailAndPassword(auth, email, senha)
        .then(() => { erroDiv.innerText = ""; })
        .catch((error) => { erroDiv.innerText = "E-mail ou senha incorretos!"; });
  };

  window.fazerLogout = function() {
      signOut(auth);
  };

  // --- INICIALIZAÇÃO DO BANCO E SINCRONIZAÇÃO ---
  async function iniciarApp() {
      const snap = await getDoc(docRef);
      if (!snap.exists()) {
          await setDoc(docRef, { poupado: 0, comum: [], silvana: [], julia: [] });
      }

      // Sincronização em tempo real
      unsubscribeSnapshot = onSnapshot(docRef, (doc) => {
          const dados = doc.data();
          if (dados) {
              atualizarInterfaceFinanceira(dados.poupado);
              renderizarLista('comum', dados.comum);
              renderizarLista('silvana', dados.silvana);
              renderizarLista('julia', dados.julia);
          }
      });
  }

  // --- LÓGICA DE DADOS (Finanças e Listas) ---
  function atualizarInterfaceFinanceira(poupado) {
      document.getElementById('valor-atual').innerText = parseFloat(poupado).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
      let porcentagem = (poupado / META_TOTAL) * 100;
      if (porcentagem > 100) porcentagem = 100;
      const barra = document.getElementById('progress-bar');
      barra.style.width = porcentagem + '%';
      barra.innerText = Math.round(porcentagem) + '%';
  }

  window.adicionarDinheiro = async function() {
      const input = document.getElementById('input-dinheiro');
      const valor = parseFloat(input.value);
      if (!isNaN(valor) && valor > 0) {
          const snap = await getDoc(docRef);
          await updateDoc(docRef, { poupado: (snap.data().poupado || 0) + valor });
          input.value = '';
      }
  };

  window.zerarDinheiro = async function() {
      if(confirm("Tem certeza que deseja zerar a poupança?")) await updateDoc(docRef, { poupado: 0 });
  };

  function renderizarLista(listaId, arrayTarefas) {
      const ul = document.getElementById(`lista-${listaId}`);
      ul.innerHTML = '';
      if (!arrayTarefas) return;
      arrayTarefas.forEach((item, index) => {
          const li = document.createElement('li');
          if (item.feito) li.className = 'checked';
          li.innerHTML = `
              <div>
                  <input type="checkbox" ${item.feito ? 'checked' : ''} onchange="alternarTarefa('${listaId}', ${index})">
                  <span>${item.texto}</span>
              </div>
              <button class="delete-btn" onclick="deletarTarefa('${listaId}', ${index})">✖</button>
          `;
          ul.appendChild(li);
      });
  }

  window.adicionarTarefa = async function(listaId, inputId) {
      const input = document.getElementById(inputId);
      const texto = input.value.trim();
      if (texto !== '') {
          const snap = await getDoc(docRef);
          const arrayAtual = snap.data()[listaId] || [];
          arrayAtual.push({ texto: texto, feito: false });
          await updateDoc(docRef, { [listaId]: arrayAtual });
          input.value = '';
      }
  };

  window.alternarTarefa = async function(listaId, index) {
      const snap = await getDoc(docRef);
      const arrayAtual = snap.data()[listaId];
      arrayAtual[index].feito = !arrayAtual[index].feito;
      await updateDoc(docRef, { [listaId]: arrayAtual });
  };

  window.deletarTarefa = async function(listaId, index) {
      const snap = await getDoc(docRef);
      const arrayAtual = snap.data()[listaId];
      arrayAtual.splice(index, 1);
      await updateDoc(docRef, { [listaId]: arrayAtual });
  };
</script>

</body>
</html>
